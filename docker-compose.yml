services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3500:3500"
    env_file: .env  # Load all variables from .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    env_file: .env  # Share the same .env file
    environment:
      POSTGRES_USER: ${DB_USER}  # Now matches .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} "]  # Fixed variable${} name
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: